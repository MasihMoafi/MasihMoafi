    <text x="810" y="127" fill="#e5e5e5" font-size="18" font-weight="600">Context, continuity, retrieval</text>

    <line x1="810" y1="153" x2="1128" y2="153" stroke="#292929" stroke-width="1.5"/>

    <text x="810" y="187" fill="#777777" font-size="12" font-weight="650" letter-spacing="2.2">02 / TOOLS</text>
    <text x="810" y="215" fill="#e5e5e5" font-size="18" font-weight="600">Less friction, clearer workflows</text>

    <line x1="810" y1="241" x2="1128" y2="241" stroke="#292929" stroke-width="1.5"/>

    <text x="810" y="275" fill="#777777" font-size="12" font-weight="650" letter-spacing="2.2">03 / RESEARCH</text>
