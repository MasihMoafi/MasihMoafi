<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220">
  <!-- Definitions for gradients, patterns, and filters -->
  <defs>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Subtle gold glow filter -->
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComponentTransfer in="blur" result="glow1">
        <feFuncA type="linear" slope="0.8"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#261b0c" stroke-width="0.5" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#080808" />
  
  <!-- Grid -->
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.8" />
  
  <style>
    .tech-text {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
    }
  </style>
  
  <!-- Tech lines/Grid overlays -->
  <line x1="0" y1="110" x2="800" y2="110" stroke="#1f180e" stroke-width="1" />
  
  <!-- Bounding Corner Accents -->
  <!-- Top Left -->
  <path d="M 15,30 L 15,15 L 30,15" fill="none" stroke="#FA9E06" stroke-width="2.5" filter="url(#gold-glow)" />
  <!-- Top Right -->
  <path d="M 785,30 L 785,15 L 770,15" fill="none" stroke="#FA9E06" stroke-width="2.5" filter="url(#gold-glow)" />
  <!-- Bottom Left -->
  <path d="M 15,190 L 15,205 L 30,205" fill="none" stroke="#FA9E06" stroke-width="2.5" filter="url(#gold-glow)" />
  <!-- Bottom Right -->
  <path d="M 785,190 L 785,205 L 770,205" fill="none" stroke="#FA9E06" stroke-width="2.5" filter="url(#gold-glow)" />
  
  <!-- Main Name Text -->
  <text x="40" y="115" class="tech-text" font-size="44" font-weight="800" fill="#FA9E06" letter-spacing="8" filter="url(#glow)">MASIH MOAFI</text>
  
  <!-- Subtitle -->
  <text x="45" y="145" class="tech-text" font-size="13" font-weight="600" fill="#e0ab5b" letter-spacing="4">AI &amp; MACHINE LEARNING ENGINEER</text>

  <!-- Digital Signature (Right Side) -->
  <g transform="translate(520, 65)">
    <!-- Hand-drawn legible cursive signature paths -->
    <!-- Masih -->
    <path d="M 25,60 
             C 27,25 35,25 40,52 
             C 45,25 53,25 55,60 
             C 55,60 57,48 65,48 
             C 65,48 63,58 68,58 
             C 71,48 76,48 76,58 
             C 79,48 83,48 85,60 
             C 87,48 90,48 90,60 
             C 93,32 98,32 98,60 
             C 98,50 104,50 106,60" 
          fill="none" stroke="#FA9E06" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#gold-glow)" />
    <!-- Dot for i in Masih -->
    <circle cx="90" cy="42" r="1.5" fill="#FA9E06" filter="url(#gold-glow)" />
    
    <!-- Moafi -->
    <path d="M 120,60 
             C 122,25 130,25 135,52 
             C 140,25 148,25 150,60 
             C 150,60 152,48 160,48 
             C 160,48 158,58 163,58 
             C 166,48 171,48 171,58 
             C 176,22 181,22 181,72 
             C 181,62 188,48 188,60 
             C 191,48 194,48 194,60" 
          fill="none" stroke="#FA9E06" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#gold-glow)" />
    <!-- Dot for i in Moafi -->
    <circle cx="188" cy="42" r="1.5" fill="#FA9E06" filter="url(#gold-glow)" />
    
    <!-- Underline flourish -->
    <path d="M 20,68 Q 110,75 200,65 Q 210,63 180,78 Q 100,90 35,80" 
          fill="none" stroke="#FA9E06" stroke-width="1.5" stroke-linecap="round" filter="url(#gold-glow)" opacity="0.8" />
  </g>
</svg>
