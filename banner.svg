<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220">
  <!-- Definitions for gradients, patterns, and filters -->
  <defs>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Subtle gold glow filter -->
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComponentTransfer in="blur" result="glow1">
        <feFuncA type="linear" slope="0.8"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#261b0c" stroke-width="0.5" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#080808" />
  
  <!-- Grid -->
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.8" />
  
  <style>
    .tech-text {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
    }
  </style>
  
  <!-- Tech lines/Grid overlays -->
  <line x1="0" y1="110" x2="800" y2="110" stroke="#1f180e" stroke-width="1" />
  
  <!-- Bounding Corner Accents -->
  <!-- Top Left -->
  <path d="M 15,30 L 15,15 L 30,15" fill="none" stroke="#FA9E06" stroke-width="2.5" filter="url(#gold-glow)" />
  <!-- Top Right -->
  <path d="M 785,30 L 785,15 L 770,15" fill="none" stroke="#FA9E06" stroke-width="2.5" filter="url(#gold-glow)" />
  <!-- Bottom Left -->
  <path d="M 15,190 L 15,205 L 30,205" fill="none" stroke="#FA9E06" stroke-width="2.5" filter="url(#gold-glow)" />
  <!-- Bottom Right -->
  <path d="M 785,190 L 785,205 L 770,205" fill="none" stroke="#FA9E06" stroke-width="2.5" filter="url(#gold-glow)" />
  
  <!-- Main Name Text -->
  <text x="40" y="115" class="tech-text" font-size="44" font-weight="800" fill="#FA9E06" letter-spacing="8" filter="url(#glow)">MASIH MOAFI</text>
  
  <!-- Subtitle -->
  <text x="45" y="145" class="tech-text" font-size="13" font-weight="600" fill="#e0ab5b" letter-spacing="4">AI &amp; MACHINE LEARNING ENGINEER</text>

  <!-- Modern Digital Signature Block (Right Side) -->
  <g transform="translate(515, 60)">
    <!-- Tech boundary box -->
    <rect x="0" y="0" width="245" height="100" fill="#080808" stroke="#FA9E06" stroke-width="1.5" opacity="0.9" />
    
    <!-- Accent corner brackets inside the box -->
    <path d="M 0,10 L 0,0 L 10,0" fill="none" stroke="#FA9E06" stroke-width="2" />
    <path d="M 245,10 L 245,0 L 235,0" fill="none" stroke="#FA9E06" stroke-width="2" />
    <path d="M 0,90 L 0,100 L 10,100" fill="none" stroke="#FA9E06" stroke-width="2" />
    <path d="M 245,90 L 245,100 L 235,100" fill="none" stroke="#FA9E06" stroke-width="2" />
    
    <!-- Grid overlay inside box -->
    <line x1="5" y1="5" x2="240" y2="5" stroke="#FA9E06" stroke-width="1" opacity="0.3" />
    
    <!-- Info Rows -->
    <text x="15" y="24" class="tech-text" font-size="9" font-weight="bold" fill="#FA9E06" letter-spacing="1.5" filter="url(#gold-glow)">SIG_ID: MM_REPLICANT.0x99</text>
    <line x1="15" y1="32" x2="230" y2="32" stroke="#FA9E06" stroke-width="0.5" opacity="0.3" />
    
    <text x="15" y="47" class="tech-text" font-size="9" fill="#e0ab5b" letter-spacing="1">HOLDER : MASIH MOAFI</text>
    <text x="15" y="62" class="tech-text" font-size="9" fill="#e0ab5b" letter-spacing="1">DEPT   : AI_INFRASTRUCTURE</text>
    <text x="15" y="77" class="tech-text" font-size="9" fill="#e0ab5b" letter-spacing="1">SIG_KEY: 9e3447b1...333c</text>
    
    <!-- Verified Status -->
    <text x="15" y="91" class="tech-text" font-size="8" fill="#FA9E06" opacity="0.8" letter-spacing="0.5">[ STATUS: VERIFIED_IDENTITY ]</text>
  </g>
</svg>
