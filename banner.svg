<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220">
  <!-- Definitions for gradients, patterns, and filters -->
  <defs>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Subtle gold glow filter -->
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComponentTransfer in="blur" result="glow1">
        <feFuncA type="linear" slope="0.8"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#261b0c" stroke-width="0.5" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#080808" />
  
  <!-- Grid -->
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.8" />
  
  <style>
    .tech-text {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
    }
  </style>
  
  <!-- Tech lines/Grid overlays -->
  <line x1="0" y1="110" x2="800" y2="110" stroke="#1f180e" stroke-width="1" />
  
  <!-- Bounding Corner Accents -->
  <!-- Top Left -->
  <path d="M 15,30 L 15,15 L 30,15" fill="none" stroke="#FA9E06" stroke-width="2.5" filter="url(#gold-glow)" />
  <!-- Top Right -->
  <path d="M 785,30 L 785,15 L 770,15" fill="none" stroke="#FA9E06" stroke-width="2.5" filter="url(#gold-glow)" />
  <!-- Bottom Left -->
  <path d="M 15,190 L 15,205 L 30,205" fill="none" stroke="#FA9E06" stroke-width="2.5" filter="url(#gold-glow)" />
  <!-- Bottom Right -->
  <path d="M 785,190 L 785,205 L 770,205" fill="none" stroke="#FA9E06" stroke-width="2.5" filter="url(#gold-glow)" />
  
  <!-- Tech Details Box (Top Left) -->
  <text x="35" y="40" class="tech-text" font-size="9" fill="#FA9E06" opacity="0.6" letter-spacing="1.5">SYS.ACT_ID: MM-99</text>
  <text x="35" y="55" class="tech-text" font-size="9" fill="#FA9E06" opacity="0.6" letter-spacing="1.5">LOC: ISFAHAN_IR</text>
  
  <!-- Tech Details Box (Top Right) -->
  <text x="765" y="40" class="tech-text" font-size="9" fill="#FA9E06" opacity="0.6" letter-spacing="1.5" text-anchor="end">STATUS: ACTIVE_REPLICATOR</text>
  
  <!-- Main Name Text -->
  <text x="40" y="115" class="tech-text" font-size="44" font-weight="800" fill="#FA9E06" letter-spacing="8" filter="url(#glow)">MASIH MOAFI</text>
  
  <!-- Subtitle -->
  <text x="45" y="145" class="tech-text" font-size="13" font-weight="600" fill="#e0ab5b" letter-spacing="4">AI &amp; MACHINE LEARNING ENGINEER</text>
  
  <!-- Stats / Technical Status bar -->
  <g transform="translate(45, 170)">
    <rect x="0" y="0" width="300" height="15" fill="none" stroke="#FA9E06" stroke-width="1" opacity="0.3" />
    <!-- Filled part -->
    <rect x="2" y="2" width="126" height="11" fill="#FA9E06" filter="url(#gold-glow)" />
    <text x="310" y="11" class="tech-text" font-size="9" fill="#FA9E06" opacity="0.8" letter-spacing="1">10k_RULE: 42.0% COMPLETE</text>
  </g>

  <!-- Digital Signature (Right Side) -->
  <g transform="translate(520, 65)">
    <!-- Tech boundary for signature -->
    <path d="M 0,10 L 0,0 L 10,0" fill="none" stroke="#FA9E06" stroke-width="1" opacity="0.4" />
    <path d="M 230,10 L 230,0 L 220,0" fill="none" stroke="#FA9E06" stroke-width="1" opacity="0.4" />
    <path d="M 0,80 L 0,90 L 10,90" fill="none" stroke="#FA9E06" stroke-width="1" opacity="0.4" />
    <path d="M 230,80 L 230,90 L 220,90" fill="none" stroke="#FA9E06" stroke-width="1" opacity="0.4" />
    
    <!-- Label -->
    <text x="10" y="15" class="tech-text" font-size="8" fill="#FA9E06" opacity="0.4" letter-spacing="1">SIGN_AUTH: SECURE_KEY_256</text>
    
    <!-- Styled cursive signature path -->
    <path d="M 30,55 
             C 35,25 42,22 47,40 
             C 50,55 52,65 57,60 
             C 61,50 63,45 68,58 
             C 71,65 73,63 76,55 
             C 79,45 81,50 85,60 
             C 87,63 89,61 90,53
             C 93,42 98,35 102,62
             C 103,67 105,62 107,55
             
             M 125,55
             C 130,22 138,20 143,45
             C 145,55 147,62 152,58
             C 157,48 162,45 165,55
             C 167,61 169,60 171,53
             C 174,45 178,43 182,58
             C 184,62 186,60 188,48
             C 192,30 197,35 195,58
             C 194,65 192,72 198,68
             C 202,65 204,50 206,53" 
          fill="none" stroke="#FA9E06" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#gold-glow)" />
          
    <!-- Underline flourish -->
    <path d="M 25,65 Q 120,72 210,62 Q 220,60 190,75 Q 110,88 45,78" 
          fill="none" stroke="#FA9E06" stroke-width="1.5" stroke-linecap="round" filter="url(#gold-glow)" opacity="0.8" />
  </g>
</svg>
